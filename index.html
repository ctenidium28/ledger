<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="メモ、学習ノート、知識台帳をまとめたサイトです。">
  <title>知識台帳</title>
  <link rel="stylesheet" href="./style.css">
  <!-- 記事のみMarkdownで表示。メモはプレーンテキストで表示します。 -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="サイトメニュー">
      <a class="site-title" href="#/ledger">知識台帳</a>
      <button class="create-button" type="button" data-open-create>＋ 新規作成</button>
      <nav class="navigation" aria-label="ページ移動">
        <a href="#/memo" data-nav="memo">メモ</a>
        <a href="#/notes" data-nav="notes">学習ノート</a>
        <a href="#/ledger" data-nav="ledger">台帳</a>
      </nav>
    </aside>

    <main id="content" class="main-content" tabindex="-1" aria-live="polite">
      <p class="loading">読み込み中...</p>
    </main>
  </div>

  <dialog id="create-dialog" class="create-dialog" aria-labelledby="create-dialog-title">
    <div class="dialog-heading">
      <h2 id="create-dialog-title">新規作成・編集</h2>
      <button class="close-button" type="button" data-close-dialog aria-label="閉じる">×</button>
    </div>
    <p>保存先を選択してください。編集画面は Pages CMS で開きます。</p>
    <div class="create-links">
      <a href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer" data-close-on-open>
        <strong>メモを編集</strong><span>「メモ」を選択して1つのテキストを更新</span>
      </a>
      <a href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer" data-close-on-open>
        <strong>学習ノートの記事を追加</strong><span>「学習ノート」→「新規作成」</span>
      </a>
      <a href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer" data-close-on-open>
        <strong>台帳の記事を追加</strong><span>「台帳」→「新規作成」</span>
      </a>
    </div>
    <p class="dialog-hint">初回はGitHubログインとリポジトリの選択が必要です。Pages CMSで保存すると、GitHub Pagesへ自動反映されます。</p>
  </dialog>
</body>
</html>
