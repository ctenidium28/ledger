# Pages CMS の Configuration に全文を貼り付けて保存しても同じ設定になります。
# 「Configuration」は記事本文の入力画面ではありません。
# 公開URLはGitHub Pagesのプロジェクトサイト /ledger/ に対応。
# 独自ドメインへの移行時は output を調整してください。
media:
  input: media
  output: /ledger/media
  rename: safe
content:
  # メモはタイトルや記事分割のない単一テキストファイル。
  - name: memo
    label: メモ
    type: file
    path: content/memo.txt
    format: raw
    operations:
      delete: false
      rename: false

  - name: notes
    label: 学習ノート
    type: collection
    path: content/notes
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.md"
    view:
      primary: title
      fields: [title]
    operations:
      rename: false
    fields:
      - name: title
        label: 題名
        type: string
        required: true
      - name: body
        label: 本文
        type: rich-text
        options:
          switcher: true
          extensions: [png, jpg, jpeg, gif, webp]
      - name: images
        label: 添付画像（任意）
        type: image
        options:
          multiple:
            max: 12
          extensions: [png, jpg, jpeg, gif, webp]
      - name: attachments
        label: 添付ファイル（任意）
        type: file
        options:
          multiple:
            max: 12
          extensions: [pdf, circ, zip, txt, md, json, csv, py, log]

  - name: ledger
    label: 台帳
    type: collection
    path: content/ledger
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.md"
    view:
      primary: title
      fields: [title]
    operations:
      rename: false
    fields:
      - name: title
        label: 題名
        type: string
        required: true
      - name: body
        label: 本文
        type: rich-text
        options:
          switcher: true
          extensions: [png, jpg, jpeg, gif, webp]
      - name: images
        label: 添付画像（任意）
        type: image
        options:
          multiple:
            max: 12
          extensions: [png, jpg, jpeg, gif, webp]
      - name: attachments
        label: 添付ファイル（任意）
        type: file
        options:
          multiple:
            max: 12
          extensions: [pdf, circ, zip, txt, md, json, csv, py, log]
