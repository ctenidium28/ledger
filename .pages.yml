# Pages CMS の Configuration に全文を貼り付けて保存しても同じ設定になります。
# 「Configuration」は記事本文の入力画面ではありません。
# 公開URLはGitHub Pagesのプロジェクトサイト /ledger/ に対応。
# 独自ドメインへの移行時は output を調整してください。
media:
  input: media
  output: /ledger/media
  rename: safe
content:
  # メモはタイトルや記事分割のない単一テキストファイル。
  - name: memo
    label: メモ
    type: file
    path: content/memo.txt
    format: raw
    operations:
      delete: false
      rename: false

  - name: notes
    label: 学習ノート
    type: collection
    path: content/notes
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.md"
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: 題名
        type: string
        required: true
      # 4つの許可パターンのみ選択可能。初稿は必須、加筆は任意。
      - name: attribution
        label: 執筆・加筆タグ（必須）
        type: select
        required: true
        description: 初稿の作成者を必ず選択し、必要な場合だけ異なる主体による加筆を選びます。
        options:
          values:
            - name: human
              label: ユーザー執筆
            - name: llm
              label: LLM生成
            - name: human_llm
              label: ユーザー執筆 ＋ LLM加筆
            - name: llm_human
              label: LLM生成 ＋ ユーザー加筆
      - name: body
        label: 本文
        type: code
        options:
          format: markdown
          extensions: [png, jpg, jpeg, gif, webp]
      - name: images
        label: 添付画像（任意）
        type: image
        options:
          multiple:
            max: 12
          extensions: [png, jpg, jpeg, gif, webp]
      - name: attachments
        label: 添付ファイル（任意）
        type: file
        options:
          multiple:
            max: 12
          extensions: [pdf, circ, zip, txt, md, json, csv, py, log]

  - name: ledger
    label: 台帳
    type: collection
    path: content/ledger
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{primary}.md"
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: 題名
        type: string
        required: true
      # 4つの許可パターンのみ選択可能。初稿は必須、加筆は任意。
      - name: attribution
        label: 執筆・加筆タグ（必須）
        type: select
        required: true
        description: 初稿の作成者を必ず選択し、必要な場合だけ異なる主体による加筆を選びます。
        options:
          values:
            - name: human
              label: ユーザー執筆
            - name: llm
              label: LLM生成
            - name: human_llm
              label: ユーザー執筆 ＋ LLM加筆
            - name: llm_human
              label: LLM生成 ＋ ユーザー加筆
      - name: body
        label: 本文
        type: code
        options:
          format: markdown
          extensions: [png, jpg, jpeg, gif, webp]
      - name: images
        label: 添付画像（任意）
        type: image
        options:
          multiple:
            max: 12
          extensions: [png, jpg, jpeg, gif, webp]
      - name: attachments
        label: 添付ファイル（任意）
        type: file
        options:
          multiple:
            max: 12
          extensions: [pdf, circ, zip, txt, md, json, csv, py, log]
